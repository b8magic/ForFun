# Native smoke test 2/3: details sheet with a place from a Google Maps link → Apple Maps (expo-maps),
# save, then open the session from history and see its map. Needs 01 (active activity: Corsa).
appId: app.serie.ios
name: 02 dettagli, luogo e mappa
---
- launchApp
- extendedWaitUntil:
    visible:
      id: activity-switcher
    timeout: 60000
- tapOn:
    id: prev-month
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: day-${PREV}-15
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: details-link
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: details-place-name
    timeout: 10000
- tapOn:
    id: details-place-name
    waitToSettleTimeoutMs: 1500
- inputText: Livorno
- pressKey: Enter
- tapOn:
    id: details-place-link
    waitToSettleTimeoutMs: 1500
- inputText: "https://www.google.com/maps/place/Livorno/@43.5485,10.3106,15z"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: map-caption
    timeout: 15000
- takeScreenshot: 10-details-map
- tapOn:
    id: details-apply
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: save
      text: "Salva 1 sessione.*"
    timeout: 10000
- tapOn:
    id: save
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      text: "1 sessione salvata.*"
    timeout: 8000
    optional: true
- extendedWaitUntil:
    notVisible:
      id: toast
    timeout: 30000
- assertVisible:
    id: day-${PREV}-15
    text: ".*1 sessione registrata.*"

# open it from history: the session page shows the place on the map
- tapOn:
    id: history-handle
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: month-${PREV}
    timeout: 10000
- tapOn:
    id: month-${PREV}
    waitToSettleTimeoutMs: 1500
# the expanded month's mini calendar and its day panel can be below the fold
- scrollUntilVisible:
    element:
      id: mini-${PREV}-15
    direction: DOWN
    timeout: 15000
- tapOn:
    id: mini-${PREV}-15
    waitToSettleTimeoutMs: 1500
- scrollUntilVisible:
    element:
      id: "session-(?!editor).+"
    direction: DOWN
    timeout: 15000
- tapOn:
    id: "session-(?!editor).+"
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: session-editor
    timeout: 10000
- scrollUntilVisible:
    element:
      id: map-caption
    direction: DOWN
    timeout: 15000
- takeScreenshot: 11-session-map
- tapOn:
    id: sheet-close
    waitToSettleTimeoutMs: 1500
# the history header (and its back button) scrolled away above the session
- scrollUntilVisible:
    element:
      id: back-to-log
    direction: UP
    timeout: 15000
- tapOn:
    id: back-to-log
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: activity-switcher
    timeout: 10000
