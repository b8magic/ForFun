# Native smoke test 3/3: iPhone calendars (EventKit) on the simulator's own test calendars.
# Connect → export both Corsa sessions (mixed day + mapped day) → "Creati: 2". Needs 02.
appId: app.serie.ios
name: 03 calendari di iPhone, esportazione
---
- launchApp
- extendedWaitUntil:
    visible:
      id: activity-switcher
      text: "Attività attiva: Corsa.*"
    timeout: 60000
- tapOn:
    id: menu
    waitToSettleTimeoutMs: 1500
- tapOn:
    id: menu-calendars
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: calendar-hub
    timeout: 10000
- takeScreenshot: 20-calendar-hub
# Collega only shows while not connected (the test run pre-grants calendar access)
- runFlow:
    when:
      visible:
        id: connect-apple
    commands:
      - tapOn:
          id: connect-apple
# only if the permission was not pre-granted
- runFlow:
    when:
      visible: "Allow Full Access"
    commands:
      - tapOn: "Allow Full Access"
- extendedWaitUntil:
    visible:
      id: conn-apple
      text: "Collegato"
    timeout: 15000
- assertVisible: "(?i)lettura e scrittura"
- takeScreenshot: 21-calendar-connected
- scrollUntilVisible:
    element:
      id: go-export
    direction: DOWN
- tapOn:
    id: go-export
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: export-next-1
    timeout: 10000
- tapOn:
    id: export-next-1
    waitToSettleTimeoutMs: 1500
# the simulator's own calendars; the app preselects the default (principale) or the only writable one
- extendedWaitUntil:
    visible:
      id: "dest-apple-.+"
    timeout: 20000
- tapOn:
    text: ".*\\(principale\\).*"
    waitToSettleTimeoutMs: 1500
    optional: true
- takeScreenshot: 22-export-destination
- tapOn:
    id: export-next-2
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: export-next-3
    timeout: 10000
- tapOn:
    id: export-next-3
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: export-confirm
    timeout: 20000
- takeScreenshot: 23-export-review
- tapOn:
    id: export-confirm
    waitToSettleTimeoutMs: 1500
- extendedWaitUntil:
    visible:
      id: export-finish
    timeout: 30000
- assertVisible: "Creati: 2"
- takeScreenshot: 24-export-done
- tapOn:
    id: export-finish
    waitToSettleTimeoutMs: 1500
