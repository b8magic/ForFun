# Serie — unsigned iOS IPA for sideloading (SideStore / AltStore Classic re-sign it with your Apple ID).
#
# Manual Run workflow and the dedicated IPA marker build artifacts only. Publication is available when
# called by serie-candidate.yml after web and native gates pass.
#
# Produces:
#   - prerelease "ipa-<run-id>" with IPA + checksum + source manifest
#     (run-id is globally unique, including calls from the candidate workflow)
#   - artifact "Serie-ipa" (zip with the same files, 7 days) and, when supported, the raw .ipa
#
# Optional: repository variable (or secret) EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID enables Google Calendar.
# Without it the app works fully and Google Calendar shows "non configurato"; iPhone calendars always work.
name: iOS IPA (unsigned, sideload)

on:
  push:
    branches: [codex/serie-calendar]
    paths: [serie/tools/ipa-build-request.json]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Commit completo da compilare (vuoto = commit selezionato)
        type: string
        default: ''
  workflow_call:
    inputs:
      release:
        type: boolean
        default: true
      candidate_sha:
        type: string
        required: true
      supersedes_tag:
        type: string
        default: ''

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ipa:
    name: Build unsigned IPA
    outputs:
      version: ${{ steps.package.outputs.version }}
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash # explicit → bash -eo pipefail, so `cmd | tee` fails when cmd fails
        working-directory: serie
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false

      - name: Verify the immutable candidate commit
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo "IPA source: $CANDIDATE_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Select Xcode 26.6 (Expo SDK 57 needs 26.4 or later)
        working-directory: .
        run: |
          XC=/Applications/Xcode_26.6.app
          [ -d "$XC" ] || XC=/Applications/Xcode.app
          sudo xcode-select -s "$XC/Contents/Developer"
          V=$(xcodebuild -version | awk 'NR==1{print $2}')
          echo "Xcode $V · iOS SDK $(xcrun --sdk iphoneos --show-sdk-version)"
          case "$V" in
            26.[4-9]*|26.[1-9][0-9]*) ;;
            *) echo "::error::Expo SDK 57 needs Xcode >= 26.4 (found $V)"; exit 1 ;;
          esac
          df -h / | tail -1
          echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: serie/package-lock.json

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Google Calendar client id (optional)
        env:
          RAW_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
        run: |
          v="${RAW_CLIENT_ID//[[:space:]]/}"
          if [ -n "$v" ]; then
            echo "EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=$v" >> "$GITHUB_ENV"
            echo "Google Calendar: configured"
          else
            echo "Google Calendar: not configured (iPhone calendars still work)"
          fi

      - name: Generate the iOS project (Continuous Native Generation)
        run: |
          npx expo prebuild --platform ios --clean --no-install
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/Serie/Info.plist

      - name: Install CocoaPods (prebuilt React Native core and Hermes)
        run: |
          cd ios
          pod install 2>&1 | tee "$RUNNER_TEMP/pod-install.log"
          grep -E "release tarball|Expo-precompiled|hermes-engine" "$RUNNER_TEMP/pod-install.log" | head -20 || true
          df -h / | tail -1

      - name: Archive (Release, unsigned)
        run: |
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace=$WS scheme=$SCHEME"
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Serie.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee "$RUNNER_TEMP/xcodebuild.log" | (command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat)
          df -h / | tail -1

      - name: Package the IPA
        id: package
        run: |
          APP=$(ls -d "$RUNNER_TEMP"/Serie.xcarchive/Products/Applications/*.app | head -1)
          test -d "$APP"
          # Release build: the Hermes JS bundle is embedded, no Metro needed on the phone
          test -f "$APP/main.jsbundle"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' -c 'Print :MinimumOSVersion' "$APP/Info.plist"
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          find "$RUNNER_TEMP/ipa/Payload" -name '._*' -delete
          ls "$RUNNER_TEMP/ipa/Payload/$(basename "$APP")/Frameworks" 2>/dev/null || true
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/Serie-unsigned.ipa" Payload)
          cd "$GITHUB_WORKSPACE"
          shasum -a 256 Serie-unsigned.ipa | tee Serie-unsigned.ipa.sha256
          APP_VERSION="$APP_VERSION" node - <<'NODE'
          const fs = require('node:fs');
          fs.writeFileSync('Serie-build.json', JSON.stringify({
            repository: process.env.GITHUB_REPOSITORY,
            sourceCommit: process.env.CANDIDATE_SHA,
            appVersion: process.env.APP_VERSION,
            buildRun: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
            buildNumber: process.env.GITHUB_RUN_NUMBER,
          }, null, 2) + '\n');
          NODE
          SIZE=$(du -h Serie-unsigned.ipa | cut -f1)
          MINS=$(( ( $(date +%s) - BUILD_START ) / 60 ))
          {
            echo "### Serie $APP_VERSION — Serie-unsigned.ipa"
            echo "- size: $SIZE · build: ~${MINS} min · build number ${{ github.run_number }}"
            echo "- Xcode: $(xcodebuild -version | head -1) · commit $CANDIDATE_SHA"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}

      - name: Upload IPA (zip, for the release job and desktop download)
        uses: actions/upload-artifact@v7
        with:
          name: Serie-ipa
          path: |
            Serie-unsigned.ipa
            Serie-unsigned.ipa.sha256
            Serie-build.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload IPA (raw file, no zip)
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          path: Serie-unsigned.ipa
          archive: false
          retention-days: 7

      - name: Keep the logs (failure, timeout or cancel)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          path: |
            ${{ runner.temp }}/pod-install.log
            ${{ runner.temp }}/xcodebuild.log
          retention-days: 7
          overwrite: true
          if-no-files-found: ignore

  release:
    name: Publish prerelease
    needs: ipa
    if: inputs.release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Serie-ipa

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ipa-${{ github.run_id }}
          target_commitish: ${{ inputs.candidate_sha || github.sha }}
          name: Serie ${{ needs.ipa.outputs.version }} — IPA ${{ github.run_number }} (non firmata)
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            Serie-unsigned.ipa
            Serie-unsigned.ipa.sha256
            Serie-build.json
          body: |
            IPA **non firmata** di Serie **${{ needs.ipa.outputs.version }}** (build ${{ github.run_number }}, commit ${{ inputs.candidate_sha || github.sha }}).
            [Build e controlli](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).
            Si installa con **SideStore** o **AltStore Classic** (non AltStore PAL), che la firmano con il tuo Apple ID.

            **Installazione**
            1. Su iPhone apri questa pagina in Safari con il login a GitHub (il repo è privato) e scarica `Serie-unsigned.ipa`.
            2. Condividi il file con SideStore/AltStore (oppure *My Apps → +* e scegli il file da File).
            3. Serve iOS 16.4 o successivo e la Modalità sviluppatore attiva (Impostazioni → Privacy e sicurezza).

            **Con un Apple ID gratuito**
            - L'app scade dopo 7 giorni: SideStore/AltStore la rinnovano (anche in automatico).
            - Massimo 3 app attive (SideStore incluso) e 10 App ID a settimana; Serie ne usa 1.
            - Il bundle id diventa `app.serie.ios.<TEAMID>`.

            **Note**
            - I calendari di iPhone funzionano sempre. Google Calendar è attivo solo se `EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID` era impostato al momento della build, e su un'app ri-firmata il login Google non è garantito.
            - La mappa del luogo richiede iOS 17; su iOS 16 compaiono nome e coordinate in testo.

      - name: Keep a superseded intermediate candidate as a draft
        if: inputs.supersedes_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SUPERSEDED_TAG: ${{ inputs.supersedes_tag }}
        run: |
          [[ "$SUPERSEDED_TAG" =~ ^ipa-[0-9]+$ ]]
          test "$SUPERSEDED_TAG" != "ipa-${{ github.run_id }}"
          test "$(gh release view "$SUPERSEDED_TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true
          gh release edit "$SUPERSEDED_TAG" --draft=true --repo "$GITHUB_REPOSITORY"
          echo "Superseded intermediate candidate $SUPERSEDED_TAG retained as draft; verified release is ipa-${{ github.run_id }}." >> "$GITHUB_STEP_SUMMARY"
